# swhook.ini — relay (stage-C vehicle-sync) tuning knobs.
# Loaded at DLL init and reloadable live with F5. Format: "key = value" (also "key value").
# Lines starting with # or ; are comments. Unknown keys are ignored (logged). Missing file = defaults.
# All values below are the built-in defaults; edit and press F5 to apply without restarting.

# --- LOD cadence: per (recipient,vehicle) append interval I = native_gap / lodDenser, clamped ---
intervalMin  = 5      # finest relay cadence in ticks (near vehicles). Smaller = sharper, more traffic.
intervalMax  = 60     # coarsest relay cadence in ticks (far vehicles). Larger = cheaper, laggier.
lodDenser    = 8      # relay this many x denser than the server's own native cadence.
lagRatio     = 0.3    # render lag as a fraction of the cadence interval (lag = interval x lagRatio).
                      # 0.5 = classic interval/2; smaller = tracks reality tighter (less lag) but
                      # overshoots more on coarse cadence.
lagMin       = 5      # floor on the lag in ticks. Near vehicles (small interval) hold at least this much
                      # lag even when interval x lagRatio is smaller.
                      # e.g. lagRatio=0.333 + lagMin=5 => near holds 5, far -> interval/3.

# --- relevance gates ---
relayMinGap  = 10     # only relay a vehicle whose native gap exceeds this (below it, native is fine).
stale        = 30     # skip if the freshest source sample is older than this many ticks (source dried up).
gapOutlier   = 30     # ignore velocity computed from a sample gap larger than this (teleport/respawn reject).

# --- bandwidth safety valve (per recipient) ---
maxPerSend      = 24    # hard cap on records appended to a single outgoing message (<= 24, buffer-bound).
budgetWindow    = 60    # bandwidth accounting window in ticks (~1s at 60 tps).
capKbpsPerPeer  = 2000  # per-recipient relay bandwidth cap in kbit/s. This is your configurable limit;
                        # nearest vehicles are served first, so lowering it drops the farthest first.

# --- startup behaviour (read once at load; NOT re-applied on F5 reload) ---
relay    = 0    # 1 = auto-enable relay at startup (no F6 needed). Use for hands-off deployment.
hotkeys  = 1    # 0 = disable ALL key input (F5/F6/F7/F8/F9/F10). Fixes behaviour to this file.
capture  = 1    # 1 = auto-start .swcap capture. 0 = no capture files (the .log text file is still written).
