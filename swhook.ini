# swhook.ini — relay (stage-C vehicle-sync) tuning knobs.
# Loaded at DLL init and reloadable live via IPC `config.reload` (GUI / `swctl config reload`). Format: "key = value" (also "key value").
# Lines starting with # or ; are comments. Unknown keys are ignored (logged). Missing file = defaults.
# All values below are the built-in defaults; edit and reload to apply without restarting.

# --- promise shape: every relayed record is pose = predict(ETA - lag), ETA = now + I_src ---
# I_src = measured cadence of the freshest source (the near player's feed), clamped to [intervalMin, intervalMax].
intervalMin  = 5      # floor on the relay cadence in ticks. Smaller = more traffic.
intervalMax  = 60     # ceiling on the relay cadence in ticks.
lodDenser    = 8      # cost cap: a vehicle is relayed no denser than (recipient's native gap / lodDenser),
                      # so 10 km vehicles get coarse (laggier, via horizonMax) updates. 0 = always I_src.
lag          = 5      # target render lag in ticks: the relayed vehicle sits this far behind reality.
horizonMax   = 30     # cap on how far ahead of the freshest sample a pose may be predicted (ticks).
                      # Beyond it the lag grows instead; smaller = less overshoot on turns, more lag.

# --- relevance gates ---
relayMinGap  = 10     # append extra records only for vehicles whose native gap exceeds this. Below it (near
                      # vehicles) the native records are still rewritten to predict(ETA - lag), no traffic added.
srcRatio     = 0.5    # only relay when the freshest source samples at most this x the recipient's native gap
                      # (a source no denser than the recipient's own feed adds nothing: native is left alone).
stale        = 300    # give a vehicle back to native sync when its freshest sample is older than this (ticks).
                      # The last relayed record before that stretches its ETA to the server's own, so no stop.
gapOutlier   = 0      # ignore velocity from a sample gap larger than this (ticks). 0 = off: teleports arrive as
                      # unload+reload, which already resets the vehicle history; kept as a spare guard.

# --- bandwidth safety valve (per recipient) ---
maxPerSend      = 24    # hard cap on records appended to a single outgoing message (<= 24, buffer-bound).
budgetWindow    = 60    # bandwidth accounting window in ticks (~1s at 60 tps).
capKbpsPerPeer  = 2000  # per-recipient relay bandwidth cap in kbit/s. This is your configurable limit;
                        # nearest vehicles are served first, so lowering it drops the farthest first.

# --- startup behaviour (read once at load; NOT re-applied on config.reload) ---
relay    = 0      # 1 = auto-enable relay at startup. Use for hands-off deployment.
capture  = 0      # 1 = auto-start .swcap capture at injection. 0 = record only when asked (GUI / swctl capture start).
ipcPort  = 28215  # localhost TCP port for the control-plane (GUI / swctl / other tools). Change on conflict.

# --- logging (hot-reloadable) ---
log             = 1    # 1 = write captures/session_<stamp>.log (startup, config, relay stats, hook status). 0 = no log file.
dumpWalkFail    = 0    # 1 = record every type=8 frame the walker could not decode to captures/walkfail_<stamp>.swcap.
dumpWalkFailMax = 200  # cap on walk-fail frames per session.
